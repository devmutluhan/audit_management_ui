<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="description" content="MegaCore" />
    <link rel="icon" href="/favicon.svg" />
    <link
      href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/splash-screen.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MegaCore</title>
  </head>

  <body class="page-loading">
    <!--begin::Theme mode setup on page load-->
    <script>
      let themeMode = "system";

      if (localStorage.getItem("kt_theme_mode_value")) {
        themeMode = localStorage.getItem("kt_theme_mode_value");
      }

      if (themeMode === "system") {
        themeMode = window.matchMedia("(prefers-color-scheme: dark)").matches
          ? "dark"
          : "light";
      }

      document.documentElement.setAttribute("data-bs-theme", themeMode);
    </script>
    <!--end::Theme mode setup on page load-->

    <div id="app"></div>

    <!--begin::Loading markup-->
    <div id="splash-screen" class="splash-screen">
      <img
        src="/media/logos/default-dark.svg"
        class="dark-logo"
        alt="MegaERP dark logo"
      />
      <img
        src="/media/logos/default.svg"
        class="light-logo"
        alt="MegaERP light logo"
      />
      <span>Loading ...</span>

      <img
        src="/media/logos/created-by-dark.svg"
        class="dark-logo"
        alt="Megabyte dark logo"
        style="
          position: fixed;
          bottom: 0px;
          height: 50px !important;
          width: 90px;
        "
      />
      <img
        src="/media/logos/created-by.svg"
        class="light-logo"
        alt="Megabyte light logo"
        style="
          position: fixed;
          bottom: 0px;
          height: 50px !important;
          width: 90px;
        "
      />
    </div>
    <!--end::Loading markup-->

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
